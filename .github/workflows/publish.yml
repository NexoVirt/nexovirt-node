name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write   # npm Trusted Publishing (OIDC) + provenance, no token needed
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # OIDC trusted publishing needs a recent npm
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --access public   # authenticates via OIDC trusted publisher
